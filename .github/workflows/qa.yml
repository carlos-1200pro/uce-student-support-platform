name: qa-checks

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile python sources
        run: python -m compileall services app
