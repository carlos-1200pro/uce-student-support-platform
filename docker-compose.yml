  api-gateway:
    build: ./services/api-gateway
    env_file: ./services/api-gateway/.env
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      tutoring-service:
        condition: service_healthy
      forum-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      calendar-service:
        condition: service_healthy
      academic-record-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      redis:
        condition: service_started

  auth-frontend:
    build: ./app/auth-frontend
    ports:
      - "3001:80"
    depends_on:
      api-gateway:
        condition: service_started

  user-frontend:
    build: ./app/user-frontend
    ports:
      - "3002:80"
    depends_on:
      api-gateway:
        condition: service_started

  tutoring-frontend:
    build: ./app/tutoring-frontend
    ports:
      - "3003:80"
    depends_on:
      api-gateway:
        condition: service_started

  forum-frontend:
    build: ./app/forum-frontend
    ports:
      - "3004:80"
    depends_on:
      api-gateway:
        condition: service_started

  payment-frontend:
    build: ./app/payment-frontend
    ports:
      - "3005:80"
    depends_on:
      api-gateway:
        condition: service_started

  calendar-frontend:
    build: ./app/calendar-frontend
    ports:
      - "3006:80"
    depends_on:
      api-gateway:
        condition: service_started

  academic-record-frontend:
    build: ./app/academic-record-frontend
    ports:
      - "3007:80"
    depends_on:
      api-gateway:
        condition: service_started

  admin-frontend:
    build: ./app/admin-frontend
    ports:
      - "3010:80"
    depends_on:
      api-gateway:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: carlos1212
      POSTGRES_DB: student_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    ports:
      - "9092:9092"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
  mongo_data:
