services:
  auth-service:
    build: ./services/microservices/auth-service
    env_file: ./services/microservices/auth-service/.env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; print(urllib.request.urlopen('http://localhost:8001/health').read())\" "]
      interval: 15s
      timeout: 5s
      retries: 10

  user-service:
    build: ./services/microservices/user-service
    env_file: ./services/microservices/user-service/.env
